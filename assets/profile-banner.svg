<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Krishnendu Bhowmick — Platform Engineering</title>
  <desc id="desc">A terminal-inspired profile banner. AWS, Kubernetes, GitOps and infrastructure automation. A delivery flow connects plan, build, deploy and observe.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111f2b"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#58d8e8"/><stop offset="1" stop-color="#ffad5b"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#58d8e8" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="398" rx="23" fill="none" stroke="#2a3947"/>
  <path d="M28 54H1172" stroke="#253341"/>
  <circle cx="32" cy="28" r="5" fill="#ffad5b"/><circle cx="50" cy="28" r="5" fill="#58d8e8"/><circle cx="68" cy="28" r="5" fill="#4a5c6c"/>
  <g font-family="Consolas, DejaVu Sans Mono, monospace">
    <text x="94" y="33" fill="#8c9ba8" font-size="12">krishnendu / platform</text>
    <text x="1137" y="33" text-anchor="end" fill="#58d8e8" font-size="11" letter-spacing="2">BUILD WITH INTENT</text>
    <text x="56" y="100" fill="#58d8e8" font-size="15">$ whoami</text>
  </g>
  <g font-family="Segoe UI, DejaVu Sans, sans-serif">
    <text x="53" y="161" fill="#f0f6fc" font-size="56" font-weight="700" letter-spacing="-1.8">Krishnendu Bhowmick</text>
    <text x="57" y="199" fill="#ffad5b" font-size="14" font-weight="600" letter-spacing="4">PLATFORM ENGINEERING</text>
    <text x="56" y="235" fill="#a9b8c6" font-size="19">AWS · Kubernetes · GitOps · Infrastructure automation</text>
  </g>
  <g font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13">
    <rect x="855" y="89" width="289" height="164" rx="12" fill="#0b121a" stroke="#26394a"/>
    <text x="878" y="122" fill="#667e90">// engineering principles</text>
    <text x="878" y="157" fill="#58d8e8">infrastructure<tspan fill="#c9d1d9">: code</tspan></text>
    <text x="878" y="187" fill="#58d8e8">delivery<tspan fill="#c9d1d9">: repeatable</tspan></text>
    <text x="878" y="217" fill="#58d8e8">operations<tspan fill="#c9d1d9">: observable</tspan></text>
    <rect x="878" y="231" width="8" height="2" fill="#ffad5b"/>
  </g>
  <path d="M56 279H1144" stroke="url(#accent)" stroke-opacity=".6"/>
  <g font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">
    <path d="M205 331H995" stroke="#314653" stroke-width="2"/>
    <g fill="#111d28" stroke="#314653"><rect x="56" y="308" width="220" height="46" rx="9"/><rect x="346" y="308" width="220" height="46" rx="9"/><rect x="636" y="308" width="220" height="46" rx="9"/><rect x="926" y="308" width="220" height="46" rx="9"/></g>
    <g fill="#58d8e8"><text x="166" y="337">01 / PLAN</text><text x="456" y="337">02 / BUILD</text><text x="746" y="337">03 / DEPLOY</text></g>
